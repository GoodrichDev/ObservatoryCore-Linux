name: Native Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  # Publishing a rolling release must finish before another push replaces it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-linux:
    name: Build, test and package Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: native/observatory-clr-criteria/**/packages.lock.json
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxtst6 xvfb mesa-utils \
            dpkg-dev desktop-file-utils file dunst dbus-x11 \
            python3 python3-numpy python3-pil sway weston wtype grim \
            libgtk-3-0 libwebkit2gtk-4.1-0 libpango-1.0-0 libpangocairo-1.0-0 \
            libcairo2 librsvg2-2 fontconfig fonts-noto-color-emoji \
            espeak-ng pulseaudio pulseaudio-utils libstdc++6 zlib1g libicu70 \
            libssl3 libgssapi-krb5-2 ca-certificates tzdata \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good fonts-dejavu-core \
            adwaita-icon-theme hicolor-icon-theme shared-mime-info libglib2.0-bin \
            bubblewrap xdg-dbus-proxy
      - name: Build and verify the self-contained real CLR criteria runtime
        run: |
          bash native/observatory-clr-criteria/build.sh "$PWD/target/clr-criteria"
          python3 native/observatory-clr-criteria/tests/smoke.py "$PWD/target/clr-criteria/observatory-clr-criteria"
          python3 native/observatory-clr-criteria/tests/mutation_roundtrip.py "$PWD/target/clr-criteria/observatory-clr-criteria"
          echo "OBSERVATORY_CLR_CRITERIA_HOST=$PWD/target/clr-criteria/observatory-clr-criteria" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p observatory-desktop
      - name: Locate native integration test executable
        run: |
          mkdir -p dist
          cargo test -p observatory-desktop --bin observatory-core --no-run --locked --message-format=json > dist/native-test-build.jsonl
      - name: Open a real native window under Xvfb
        run: |
          timeout 90s dbus-run-session -- xvfb-run -a /usr/bin/python3 native/scripts/smoke_test.py target/release/observatory-core --output dist/native-smoke
      - name: Exercise native installed-plugin ports and overlay windows
        run: |
          timeout 180s dbus-run-session -- xvfb-run -a /usr/bin/python3 native/scripts/plugin_smoke_test.py target/release/observatory-core --output dist/native-plugin-smoke
      - name: Click BioInsights pages and detach/reattach the real native control
        run: |
          timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24" /usr/bin/python3 native/scripts/bioinsights_navigation_test.py target/release/observatory-core --output dist/bioinsights-navigation-clicks.json
      - name: Verify real audio helpers through a private null sink
        run: |
          timeout 180s /usr/bin/python3 native/scripts/actual_audio_acceptance.py --build-log "$PWD/dist/native-test-build.jsonl" --app-binary "$PWD/target/release/observatory-core" --output "$PWD/dist/private-audio"
      - name: Verify fullscreen focus and click-through on private X11
        run: |
          sudo mkdir -p /tmp/.X11-unix
          sudo timeout 90s /usr/bin/python3 native/scripts/actual_fullscreen_acceptance.py --kind x11 --build-log "$PWD/dist/native-test-build.jsonl" --app-binary "$PWD/target/release/observatory-core" --output "$PWD/dist/private-x11"
      - name: Verify fullscreen focus and compositor fallback on private Wayland
        run: |
          timeout 180s /usr/bin/python3 native/scripts/actual_fullscreen_acceptance.py --kind wayland --build-log "$PWD/dist/native-test-build.jsonl" --app-binary "$PWD/target/release/observatory-core" --output "$PWD/dist/private-wayland"
      - name: Package and verify installation layout
        run: |
          sh native/scripts/package.sh --binary "$PWD/target/release/observatory-core" --clr-runtime "$PWD/target/clr-criteria"
          sh native/scripts/verify-package.sh dist --clr-runtime "$PWD/target/clr-criteria"
      - name: Build and verify updateable AppImage
        run: |
          bash native/scripts/package-appimage.sh --bundle "$PWD"/dist/observatory-core-*-x86_64-linux.tar.gz --out "$PWD/dist"
          /usr/bin/python3 native/scripts/verify-appimage.py "$PWD/dist/Observatory_Core-x86_64.AppImage" --output "$PWD/dist/appimage-verification.json"
          /usr/bin/python3 native/scripts/appimage_update_test.py --image "$PWD/dist/Observatory_Core-x86_64.AppImage" --output "$PWD/dist/appimage-update-verification.json"
          cd dist
          cat SHA256SUMS AppImage-SHA256SUMS > SHA256SUMS.tmp
          sha256sum install.sh >> SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
      - name: Upload Linux packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observatory-core-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/install.sh
            dist/SHA256SUMS
            dist/package-verification.json
            dist/appimage-verification.json
            dist/appimage-update-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload verification reports and diagnostic captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observatory-core-linux-verification
          path: |
            dist/native-test-build.jsonl
            dist/native-smoke/
            dist/native-plugin-smoke/
            dist/bioinsights-navigation-clicks.json
            dist/private-audio/
            dist/private-x11/
            dist/private-wayland/
          if-no-files-found: ignore
          retention-days: 14

  publish-linux:
    name: Publish installable Linux release
    needs: native-linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observatory-core-linux-x86_64
          path: dist
      - name: Publish verified packages and rolling update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash native/scripts/publish-linux.sh "$PWD/dist"
